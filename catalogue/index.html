<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MERCBEX Product Catalogue</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="catalogue-shell">
      <section class="sidebar" aria-label="Product categories">
        <div class="brand-lockup">
          <img src="../brand-system/mercbex-logo.png" alt="MERCBEX" />
          <p>Product label catalogue</p>
        </div>

        <div class="category-list" id="categoryList"></div>
      </section>

      <section class="product-panel" aria-label="Products">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Category</p>
            <h1 id="categoryTitle">Insecticide</h1>
          </div>
          <span id="categoryPill" class="category-pill">Deep Emerald Green</span>
        </div>

        <div class="products-grid" id="productsGrid"></div>
      </section>

      <section class="label-stage" aria-label="Printable label preview">
        <div class="stage-toolbar">
          <div>
            <p class="eyebrow">Preview</p>
            <h2 id="selectedName">ACEMAN</h2>
          </div>
          <div class="toolbar-actions">
            <button id="downloadSvg" type="button">Download SVG</button>
            <button id="printLabel" type="button">Print</button>
            <button id="toggleEditPanel" type="button" class="edit-toggle" aria-pressed="false">Customize</button>
          </div>
        </div>

        <div id="editPanel" class="edit-panel" hidden>
          <div class="edit-fields">
            <label class="edit-field">
              <span>Product Name</span>
              <input type="text" id="editProductName" />
            </label>
            <label class="edit-field">
              <span>Active Ingredient</span>
              <input type="text" id="editActive" />
            </label>
            <label class="edit-field">
              <span>Concentration</span>
              <input type="text" id="editConcentration" />
            </label>
            <label class="edit-field">
              <span>Mode of Action</span>
              <input type="text" id="editMode" />
            </label>
            <label class="edit-field">
              <span>Panel Color</span>
              <input type="color" id="editColor" value="#006B46" />
            </label>
            <label class="edit-field">
              <span>Net Content</span>
              <select id="editNetContent">
                <option value="100 mL">100 mL</option>
                <option value="250 mL">250 mL</option>
                <option value="500 mL">500 mL</option>
                <option value="1 L" selected>1 L</option>
                <option value="5 L">5 L</option>
              </select>
            </label>
          </div>
          <button id="resetEditPanel" type="button" class="edit-reset">Reset to defaults</button>
        </div>

        <div class="label-frame">
          <div class="preview-slot">
            <span class="preview-slot-label">Print Label</span>
            <div id="labelPreview" class="label-preview"></div>
          </div>
          <div class="preview-slot">
            <span class="preview-slot-label">Bottle Mockup</span>
            <div id="bottlePreview" class="bottle-preview"></div>
          </div>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
