      .cat { font-size: 19px; font-weight: 700; fill: #FFFFFF; }
      .name { font-size: 38px; font-weight: 790; fill: #FFFFFF; }
      .detail { font-size: 18px; font-weight: 520; fill: #FFFFFF; }
